name: 同步mg主库

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-nodes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Configure Git credentials
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # 这里的配置是为了防止 checkout 阶段意外触发 LFS
          git config --global filter.lfs.smudge "cat"
          git config --global filter.lfs.clean "cat"

      - name: Run sync script
        run: |
          # === 1. 彻底“阉割” LFS 功能 ===
          # 移除所有 LFS 相关的过滤器和钩子
          # 这样 Git 就会把 LFS 文件当成普通文本（指针）处理，而不会尝试上传到 LFS 服务器
          git config --global --unset-all filter.lfs.required || true
          git config --global --unset-all filter.lfs.smudge || true
          git config --global --unset-all filter.lfs.clean || true
          git config --global --unset-all filter.lfs.process || true
          
          # 允许推送“不完整”的 LFS（即只推指针，不推实体文件）
          git config --global lfs.allowincompletepush true
          
          # 移除可能存在的 pre-push 钩子
          rm -f .git/hooks/pre-push

          # === 2. 准备上游 ===
          git remote add upstream https://github.com/mg-org-1/ComfyUI.git 2>/dev/null || true
          git fetch upstream
          git checkout master
          
          # === 3. 备份本地关键文件 ===
          LOCAL_README_EXIST=0
          [ -f "README.md" ] && { cp README.md /tmp/README.md.backup; LOCAL_README_EXIST=1; }
          
          LOCAL_WORKFLOWS_EXIST=0
          [ -d ".github/workflows" ] && { cp -r .github/workflows /tmp/workflows.backup; LOCAL_WORKFLOWS_EXIST=1; }
          
          # === 4. 清理 .gitattributes 中的 LFS 规则 ===
          # 这一步是为了防止以后别人 clone 时自动触发 LFS 下载
          if [ -f ".gitattributes" ]; then
            cp .gitattributes /tmp/gitattributes.backup
            grep -v 'filter=lfs' /tmp/gitattributes.backup > .gitattributes.new
            mv .gitattributes.new .gitattributes
            git add .gitattributes
          fi
          
          # === 5. 合并上游 ===
          if ! git merge --no-ff --no-commit upstream/master; then
            echo "Merge conflict detected. Taking upstream version for all files..."
            git checkout --theirs .
            git add .
          fi
          
          # === 6. 恢复本地文件 ===
          if [ "$LOCAL_README_EXIST" = "1" ]; then
            cp /tmp/README.md.backup README.md
            git add README.md
          fi
          
          if [ "$LOCAL_WORKFLOWS_EXIST" = "1" ]; then
            rm -rf .github/workflows
            cp -r /tmp/workflows.backup .github/workflows
            git add .github/workflows
          fi
          
          # 清理空目录
          if [ -d ".github" ] && [ -z "$(ls -A .github 2>/dev/null)" ]; then
            rmdir .github
            git add -A
          fi
          
          git add -A
          
          # === 7. 提交并推送 ===
          if ! git diff --cached --quiet; then
            git commit -m "Sync with upstream/master and restore local files"
            # 使用 --no-verify 跳过所有钩子检查
            git push origin master --no-verify
          else
            echo "No changes to commit."
          fi

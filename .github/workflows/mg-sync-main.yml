name: 同步mg主库

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# 全局环境变量：强制 Git LFS 跳过下载
env:
  GIT_LFS_SKIP_SMUDGE: 1

jobs:
  sync-nodes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false 

      - name: Configure Git and Kill LFS
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # === 核心修复：暴力劫持 LFS 过滤器 ===
          # 无论 .gitattributes 怎么写，强制把 LFS 操作变成“什么都不做”
          # 这样 Git 就不会去尝试下载那个 404 的 mp4 文件，而是直接保留指针文本
          git config --global filter.lfs.process "cat"
          git config --global filter.lfs.smudge "cat"
          git config --global filter.lfs.clean "cat"
          git config --global filter.lfs.required false
          
          # 允许推送不完整的文件（只推指针）
          git config --global lfs.allowincompletepush true

      - name: Run sync script
        run: |
          # 再次确保环境变量生效
          export GIT_LFS_SKIP_SMUDGE=1
          
          # 移除可能存在的钩子，防止 push 时报错
          rm -f .git/hooks/pre-push
          
          # === 准备上游 ===
          git remote add upstream https://github.com/mg-org-1/ComfyUI.git 2>/dev/null || true
          git fetch upstream
          git checkout master
          
          # === 备份本地关键文件 ===
          LOCAL_README_EXIST=0
          [ -f "README.md" ] && { cp README.md /tmp/README.md.backup; LOCAL_README_EXIST=1; }
          
          LOCAL_WORKFLOWS_EXIST=0
          [ -d ".github/workflows" ] && { cp -r .github/workflows /tmp/workflows.backup; LOCAL_WORKFLOWS_EXIST=1; }
          
          # === 合并上游 ===
          echo "Starting merge..."
          # 这里的 merge 现在应该会成功，因为 filter.lfs.process 已经被替换成了 cat
          if ! git merge --no-ff --no-commit upstream/master; then
            echo "Merge conflict detected. Taking upstream version..."
            git checkout --theirs .
            git add .
          fi
          
          # === 恢复本地文件 ===
          if [ "$LOCAL_README_EXIST" = "1" ]; then
            cp /tmp/README.md.backup README.md
            git add README.md
          fi
          
          if [ "$LOCAL_WORKFLOWS_EXIST" = "1" ]; then
            rm -rf .github/workflows
            cp -r /tmp/workflows.backup .github/workflows
            git add .github/workflows
          fi
          
          # 清理空目录
          if [ -d ".github" ] && [ -z "$(ls -A .github 2>/dev/null)" ]; then
            rmdir .github
            git add -A
          fi
          
          git add -A
          
          # === 提交并推送 ===
          if ! git diff --cached --quiet; then
            git commit -m "Sync with upstream/master (LFS disabled)"
            
            # 使用 --no-verify 跳过所有钩子检查
            git push origin master --no-verify
            echo "Push success."
          else
            echo "No changes to commit."
          fi
